services:
  db:
    image: postgres:15
    container_name: talash_db
    restart: always
    environment:
      POSTGRES_USER: talash
      POSTGRES_PASSWORD: talash123
      POSTGRES_DB: talash_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: talash_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data: